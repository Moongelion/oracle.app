<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oracle</title>
    

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon/icon.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#11100f">

    <link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap"
  rel="stylesheet">

</head>

<body>
  
  
      <main class="app">

        <nav class="top-nav">

      <button class="top-nav__logo" id="sidebarLogo">
          <img src="assets/favicon/icon.png" alt="Oracle">
      </button>

        <div class="top-nav__links">

            <button class="top-nav__item" data-section="utilities">
                UTILITIES
            </button>

            <button class="top-nav__item" data-section="extras">
                EXTRAS
            </button>

            <button class="top-nav__item" data-section="about">
                ABOUT
            </button>

            <button class="top-nav__item" data-section="whatever">
                WHATEVER
            </button>

        </div>

    </nav>

        <h1 class="app__title">ORACLE</h1>

        <div class="ornament" aria-hidden="true">
    ✦ ───── ✧ ───── ✦
        </div>

        <p class="app__subtitle">
            Dice & Tarot
        </p>

        <!-- MENU -->

        <section class="menu">

          <button class="menu__button" id="diceButton">
            <span class="menu__icon">◇</span>
            <span>DICE</span>
          </button>
          <button class="menu__button" id="tarotButton">
            <span class="menu__icon">✦</span>
            <span>TAROT</span>
          </button>

        </section>


        <!-- SCREENS -->


        <!-- DICE SCREEN -->

        <section class="dice-screen" id="diceScreen">

            <button class="back-button" id="backFromDice">
                ← Back
            </button>

            <h2 id="diceTitle">D20</h2>

            <div class="dice-options">

                <button class="dice-option" data-sides="4">d4</button>
                <button class="dice-option" data-sides="6">d6</button>
                <button class="dice-option" data-sides="8">d8</button>
                <button class="dice-option" data-sides="10">d10</button>
                <button class="dice-option" data-sides="12">d12</button>
                <button class="dice-option" data-sides="20">d20</button>
                <button class="dice-option" data-sides="100">d100</button>

            </div>
            <div class="dice-visual" id="diceVisual">
              <img
                class="dice-image"
                src="assets/dice/d20img.png"
                alt="Dice">

                 <div class="dice-shine" id="diceShine"></div>
          <div class="dice-result" id="diceResult">
            ?
          </div>
        </div>
        
        <button class="roll-button" id="rollDice">
                ROLL
        </button>

        </section>


        <!-- TAROT SCREEN -->

        <section class="tarot-screen" id="tarotScreen">

            <button class="back-button" id="backFromTarot">
                ← Back
            </button>

            <h2>TAROT</h2>
            <div class="tarot-card" id="tarotCard">
              
              <div class="tarot-card__inner">
                <div class="tarot-card__back">
                  <span>ORACLE</span>
                </div>
                <div class="tarot-card__front">
                  <img
                  class="tarot-card__image"
                  id="tarotImage"
                  src=""
                  alt="">
                  <span class="tarot-card__name" id="tarotName">
                    ?
                  </span>
                </div>
              </div>

              <div class="tarot-particles" aria-hidden="true">
                <span class="particle p1">✦</span>
                <span class="particle p2">✧</span>
                <span class="particle p3">✦</span>
                <span class="particle p4">✧</span>
                <span class="particle p5">✦</span>
              </div>
            </div>

            <button class="roll-button" id="drawCard">
                DRAW A CARD
            </button>
        </section>
      </main>
      <script src="app.js"></script>
    </body>
</html>
